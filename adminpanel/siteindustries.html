<script src="admin-roles.js" defer></script>
<script>
/* ---------- CONFIG ---------- */
const API_BASE = "https://siteareahyderabadbackend.onrender.com";
const SUPABASE_URL = "https://uxrfnwbdzrvbqfnjmgpp.supabase.co";
const SUPABASE_ANON_KEY = "your-public-anon-key";
const industryModal = new bootstrap.Modal(document.getElementById('industryModal'));

let currentUserRole = null; // 👈 store current role

/* ---------- ROLE BADGE DISPLAY ---------- */
function showRoleBadge(roles) {
  try {
    const badge = document.getElementById('roleBadge');
    if (!badge) return;
    badge.style.display = 'inline-block';
    badge.textContent = 'Role: ' + (Array.isArray(roles) ? roles.join(', ') : String(roles));
  } catch (e) {
    console.warn('showRoleBadge error', e);
  }
}

// 🟢 Listen for roles loaded event (from admin-roles.js)
document.addEventListener('adminRolesLoaded', (e) => {
  const roles = e.detail.roles || [];
  currentUserRole = Array.isArray(roles) ? roles[0] : roles; // assume single
  showRoleBadge(roles);
});

// Fallback if roles already exist
if (window.adminRoles && window.adminRoles.roles) {
  currentUserRole = window.adminRoles.roles[0];
  showRoleBadge(window.adminRoles.roles);
}

/* ---------- DROPDOWN MENU ---------- */
document.querySelectorAll(".dropdown-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const content = btn.nextElementSibling;
    if (!content) return;
    content.classList.toggle("active");
    btn.textContent = btn.textContent.includes("▾")
      ? btn.textContent.replace("▾", "▸")
      : btn.textContent.replace("▸", "▾");
  });
});

/* ---------- TOKEN HELPERS ---------- */
function loadToken() {
  const keys = ['sb-uxrfnwbdzrvbqfnjmgpp-auth-token', 'sb:auth.v1.session', 'adminSession'];
  for (const k of keys) {
    const raw = localStorage.getItem(k);
    if (!raw) continue;
    try {
      const parsed = JSON.parse(raw);
      const token =
        parsed?.access_token ||
        parsed?.currentSession?.access_token ||
        parsed?.data?.session?.access_token ||
        parsed?.session?.access_token ||
        parsed?.token ||
        null;
      const refresh = parsed?.refresh_token || parsed?.session?.refresh_token || null;
      if (token) return { token, refresh };
    } catch (e) {
      console.warn("Invalid JSON in", k);
    }
  }
  return { token: null, refresh: null };
}

/* ---------- TOKEN REFRESH ---------- */
async function refreshAccessToken() {
  const { refresh } = loadToken();
  if (!refresh) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    const json = await res.json();
    if (json?.access_token) {
      localStorage.setItem("sb-uxrfnwbdzrvbqfnjmgpp-auth-token", JSON.stringify(json));
      return json.access_token;
    }
    return null;
  } catch {
    return null;
  }
}

/* ---------- AUTHORIZED FETCH ---------- */
async function authorizedFetch(url, options = {}) {
  let { token } = loadToken();
  if (!token) {
    alert("⚠️ Not logged in or token missing!");
    throw new Error("Missing token");
  }
  options.headers = {
    ...(options.headers || {}),
    Authorization: `Bearer ${token}`,
    "Content-Type": "application/json",
  };
  let res = await fetch(url, options);
  if (res.status === 401) {
    const newToken = await refreshAccessToken();
    if (newToken) {
      options.headers.Authorization = `Bearer ${newToken}`;
      res = await fetch(url, options);
    } else {
      localStorage.clear();
      window.location.href = "index.html";
      return res;
    }
  }
  return res;
}

/* ---------- FETCH INDUSTRIES ---------- */
async function fetchIndustries() {
  try {
    const res = await authorizedFetch(`${API_BASE}/get-industries`);
    const data = await res.json();
    const tbody = document.getElementById("industryTable");
    tbody.innerHTML = "";

    (data.industries || []).forEach((ind) => {
      const safeIcon = ind.icon ? ind.icon.replace(/"/g, "&quot;") : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${ind.icon?.startsWith("http") ? `<img src="${ind.icon}" width="40">` : (ind.icon || "🏭")}</td>
        <td>${ind.name}</td>
        <td>
          <button class="btn btn-sm btn-primary btn-edit"
            data-id="${ind.id}"
            data-name="${ind.name}"
            data-icon="${safeIcon}">Edit</button>
          <button class="btn btn-sm btn-danger btn-delete" data-id="${ind.id}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // 🟡 Hide delete buttons if admin (not superadmin)
    if (currentUserRole && currentUserRole.toLowerCase() === "admin") {
      document.querySelectorAll(".btn-delete").forEach(btn => btn.style.display = "none");
    }

  } catch (err) {
    console.error("Error fetching industries:", err);
  }
}

/* ---------- ADD / UPDATE ---------- */
document.getElementById("industryForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("industryId").value;
  const name = document.getElementById("name").value.trim();
  const icon = document.getElementById("icon").value.trim();
  if (!name) return alert("Industry name required");

  try {
    const res = await authorizedFetch(`${API_BASE}/${id ? "update-industry/" + id : "add-industry"}`, {
      method: id ? "PUT" : "POST",
      body: JSON.stringify({ name, icon }),
    });
    const json = await res.json();
    if (!res.ok) return alert("Error: " + (json.message || res.status));
    alert("✅ Saved successfully");
    industryModal.hide();
    fetchIndustries();
  } catch (err) {
    console.error(err);
    alert("Network error");
  }
});

function openForm() {
  document.getElementById('industryId').value = '';
  document.getElementById('name').value = '';
  document.getElementById('icon').value = '';
  document.querySelector('#industryModal .modal-title').innerText = 'Add Industry';
  industryModal.show();
}

/* ---------- DELETE ---------- */
document.addEventListener("click", async (e) => {
  if (e.target.classList.contains("btn-delete")) {
    if (!confirm("Are you sure you want to delete this industry?")) return;
    const id = e.target.dataset.id;
    try {
      const res = await authorizedFetch(`${API_BASE}/delete-industry/${id}`, {
        method: "DELETE",
      });
      const json = await res.json();
      if (!res.ok) return alert("Error: " + (json.message || res.status));
      alert("🗑️ Deleted successfully");
      fetchIndustries();
    } catch (err) {
      console.error(err);
      alert("Network error");
    }
  }

  if (e.target.classList.contains("btn-edit")) {
    const id = e.target.dataset.id;
    const name = e.target.dataset.name;
    const icon = e.target.dataset.icon;
    document.getElementById("industryId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("icon").value = icon;
    document.querySelector("#industryModal .modal-title").innerText = "Edit Industry";
    new bootstrap.Modal(document.getElementById("industryModal")).show();
  }
});

/* ---------- INIT ---------- */
(async function init() {
  console.log("%c[INIT] Loading industries...", "color:blue");
  await fetchIndustries();
})();
</script>

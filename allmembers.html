    .members-grid {

      width: 100%;

    .person-card {

      padding: 2.2rem 1.2rem 1.5rem 1.2rem;
      text-align: center;
      position: relative;
      transition: box-shadow 0.22s, transform 0.22s;
      border-top: 5px solid rgb(53, 130, 50);
      overflow: hidden;
      margin-top: 1rem;
    }
    .person-card:hover {
      box-shadow: 0 8px 32px rgba(53,130,50,0.18), 0 2px 12px rgba(53,130,50,0.10);
      transform: translateY(-6px) scale(1.04);
      border-top: 5px solid rgb(177, 145, 79);
    }
    .person-card .person-img {
      margin-bottom: 1.1rem;
      border-radius: 12px;
      border: 3px solid #e6f0fa;
      box-shadow: 0 2px 8px rgba(53,130,50,0.08);
      width: 150px;
      height: 200px;
      object-fit: cover;
      transition: transform 0.22s, box-shadow 0.22s;
    }

    .person-card .divider {

      height: 3px;
      background: rgb(177, 145, 79);
      border-radius: 2px;
      margin: 0.5rem auto 1rem auto;
    }
    .person-card p {
      color: #333;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
    }
    .members-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 cards per row */
    gap: 20px;
    padding: 20px;
  }

  .person-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;

  .person-img {

    border-radius: 50%;
    margin-bottom: 10px;

  @media screen and (max-width: 768px) {
    .members-grid {
      grid-template-columns: repeat(2, 1fr); /* tablet view */
    }
  }

  @media screen and (max-width: 480px) {
    .members-grid {
      grid-template-columns: 1fr; /* mobile view */
    }
  }
    @media (max-width: 1200px) {

    }
    @media (max-width: 900px) {

    }
    @media (max-width: 600px) {

  <script src="nav-fix.js" defer></script>
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const grid = document.getElementById("memberTable");
    try {
      // Fetch industries first to map ids to names
      const indRes = await fetch("https://siteareahyderabadbackend.onrender.com/get-industries");
      let industryMap = {};
      if (indRes.ok) {
        const indJson = await indRes.json();
        const industries = Array.isArray(indJson.industries) ? indJson.industries : indJson.data || [];
        industries.forEach(i => { if (i && (i.id || i.industry_id)) industryMap[i.id || i.industry_id] = i.name || i.industry_name || i.title || '' });
      }

      const res = await fetch("https://siteareahyderabadbackend.onrender.com/get-all-members");
      const data = await res.json();

      if (!data.message || !Array.isArray(data.message) || data.message.length === 0) {
        grid.innerHTML = "<p>No members found.</p>";
        return;
      }

      data.message.forEach(member => {
        const card = document.createElement("div");
        console.log("check memeber dettails ", member);

        card.className = "person-card";

        const first = member.first_name || member.firstName || '';
        const last = member.last_name || member.lastName || '';
        console.log("company name ", member.company);
        const companyname = member.company || '';
        const full = (first + ' ' + last).trim();
        const displayName = member.name || full || member.membername || first || 'Member Name';
        const imgSrc = (member.file_url && member.file_url.trim()) || member.image || member.photo || 'assests/avatar.png';
        let industryText = '';
        
        if (member.industrycategories) industryText = member.industrycategories;
        
        else if (member.industry || member.industrycategory) industryText = member.industry || member.industrycategory;
        else if (member.industry_id || member.industryId) industryText = industryMap[member.industry_id || member.industryId] || String(member.industry_id || member.industryId || '');

        card.innerHTML = `
          <img src="${imgSrc || 'assests/avatar.png'}" alt="${displayName}" class="person-img" onerror="this.onerror=null;this.src='assests/avatar.png'" />
          <h4>${displayName}</h4>
          <h4>${companyname}</h4>
          <div class="divider"></div>
          <p class="industry-cats">${industryText}</p>
         
        `;
        
        // Add data attribute for filtering by name
        card.setAttribute('data-member-name', displayName);

        grid.appendChild(card);
      });
    } catch (err) {
      console.error("Error fetching members:", err);
      grid.innerHTML = "<p style='color:red;'>Failed to load members. Please try again later.</p>";
    }
  });

  // Helper function to normalize text (remove spaces and dots for comparison)
  function normalizeText(text) {
    return text.toLowerCase()
      .replace(/\s+/g, '')      // Remove all spaces
      .replace(/\./g, '');       // Remove all dots
  }

  // Search/Filter function for members by name only
  function filterMembersByName() {
    const searchInput = document.getElementById('searchInput');
    const rawFilter = searchInput.value.trim();
    const filter = normalizeText(rawFilter);
    const grid = document.getElementById('memberTable');
    const cards = grid.getElementsByClassName('person-card');

    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const memberName = card.getAttribute('data-member-name') || '';
      const normalizedName = normalizeText(memberName);
      
      // Show/hide card based on name match
      if (normalizedName.includes(filter) || filter === '') {
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    }
  }

  </script>

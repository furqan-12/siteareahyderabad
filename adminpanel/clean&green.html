 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =====================================================
   CONFIG
===================================================== */
const API_BASE = "https://siteareahyderabadbackend.onrender.com";
const memberModal = new bootstrap.Modal(document.getElementById("memberModal"));
const preview = document.getElementById("imagePreview");

/* -------------------
   SIDEBAR DROPDOWN
-------------------- */
document.querySelectorAll(".dropdown-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const parent = btn.closest(".dropdown-container");
    parent.classList.toggle("active");
  });
});

/* -------------------
   MODAL OPEN
-------------------- */
function openForm() {
  document.getElementById("memberForm").reset();
  document.getElementById("circularId").value = "";
  preview.src = "https://via.placeholder.com/100";
  document.querySelector("#memberModal .modal-title").innerText = "Add Circular";
  document.getElementById("editNote").innerText = "";
  memberModal.show();
}
window.openForm = openForm;

/* -------------------
   IMAGE PREVIEW
-------------------- */
document.getElementById("circularimage").addEventListener("change", function () {
  const file = this.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
});

/* -------------------
   TOKEN HELPERS
-------------------- */
function loadToken() {
  try {
    const adminData = JSON.parse(localStorage.getItem("adminSession"));
    if (adminData?.session?.access_token) {
      return { token: adminData.session.access_token };
    }
  } catch {}
  return { token: null };
}

async function authorizedFetch(url, options = {}) {
  const { token } = loadToken();
  if (!token) {
    alert("⚠️ Not logged in!");
    window.location.href = "index.html";
    throw new Error("No token");
  }

  options.headers = {
    ...(options.headers || {}),
    Authorization: `Bearer ${token}`,
    "Content-Type": "application/json",
  };
  return fetch(url, options);
}

/* -------------------
   TO BASE64
-------------------- */
async function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Compress image file (resize + quality) and return dataURL
async function compressImageFile(file, maxWidth = 1024, maxHeight = 1024, quality = 0.7) {
  if (!file || !file.type.startsWith('image/')) return null;
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = dataUrl;
  });

  let { width, height } = img;
  let targetWidth = width;
  let targetHeight = height;
  if (width > maxWidth || height > maxHeight) {
    const ratio = Math.min(maxWidth / width, maxHeight / height);
    targetWidth = Math.round(width * ratio);
    targetHeight = Math.round(height * ratio);
  }

  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

  const mime = file.type === 'image/png' ? 'image/jpeg' : file.type;
  return canvas.toDataURL(mime, quality);
}

/* -------------------
   ROLE BADGE
-------------------- */
function showRoleBadge(roles) {
  try {
    const badge = document.getElementById('roleBadge');
    if (!badge) return;
    badge.style.display = 'inline-block';
    badge.textContent = 'Role: ' + (Array.isArray(roles) ? roles.join(', ') : String(roles));
  } catch (e) { console.warn('showRoleBadge error', e); }
}

// Listen for roles load event from admin-roles.js
document.addEventListener('adminRolesLoaded', (e) => {
  try { showRoleBadge(e.detail.roles || []); } catch (err) { console.warn(err); }
});

// If roles already present on window, show immediately
if (window.adminRoles && Array.isArray(window.adminRoles.roles) && window.adminRoles.roles.length) {
  showRoleBadge(window.adminRoles.roles);
}

/* -------------------
   FETCH LIST
-------------------- */
async function fetchCirculars() {
  try {
    const res = await authorizedFetch(`${API_BASE}/get-clean`);
    const data = await res.json();
    const tbody = document.getElementById("memberTable");
    tbody.innerHTML = "";

    const items = data?.message || data?.mesage || data?.data || [];

    if (!Array.isArray(items) || !items.length) {
      tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">No records found</td></tr>`;
      return;
    }

    const rolesArr = (window.adminRoles?.roles || []).map(r => String(r).toLowerCase());

    items.forEach(item => {
      const imgURL = item.cleanimage || "https://via.placeholder.com/100";
      const canDelete = rolesArr.includes('superadmin') || rolesArr.includes('admin');

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.title || "N/A"}</td>
        <td><img src="${imgURL}" width="60" class="rounded"></td>
        <td>
          <button class="btn btn-sm btn-primary btn-edit"
            data-id="${item.id}"
            data-title="${item.title}"
            data-img="${imgURL}">Edit</button>
          ${canDelete ? `<button class="btn btn-sm btn-danger btn-delete" data-id="${item.id}">Delete</button>` : ""}
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error("Fetch error:", err);
  }
}

/* -------------------
   ADD / UPDATE
-------------------- */
/* -------------------
   ADD / UPDATE CIRCULAR
-------------------- */
document.getElementById("memberForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const id = document.getElementById("circularId").value?.trim();
  const title = document.getElementById("title").value.trim();
  const fileInput = document.getElementById("circularimage");
  const newFile = fileInput.files[0];

  // Old image from preview (if editing)
  const oldImage = document.getElementById("imagePreview").src;

  const btn = e.submitter || document.querySelector("button[type='submit']");
  btn.disabled = true;
  btn.innerText = "⏳ Saving...";

  try {
    let image = null;

    // ✅ New image selected → compress then convert to dataURL (faster upload)
    if (newFile) {
      try {
        image = await compressImageFile(newFile, 1024, 1024, 0.7);
      } catch (err) {
        console.warn('Compression failed, falling back to raw:', err);
        image = await toBase64(newFile);
      }
    }
    // ✅ Editing & no new image → keep old
    else if (id && oldImage && !oldImage.includes("placeholder")) {
      image = oldImage;
    }
    // ✅ Adding & no image → optional: alert
    else if (!id && !newFile) {
      alert("⚠️ Please upload an image.");
      btn.disabled = false;
      btn.innerText = "Save";
      return;
    }

    // Prepare payload
    const payload = { title };
    if (image) payload.image = image; // attach ONLY if exists

    const endpoint = id ? `${API_BASE}/update-clean/${id}` : `${API_BASE}/add-clean`;
    const method = id ? "PUT" : "POST";

    console.log("🧾 Sending Payload:", payload);

    const res = await authorizedFetch(endpoint, {
      method,
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const txt = await res.text();
      console.error("❌ Server error:", txt);
      alert("Save failed: " + res.statusText);
      return;
    }

    alert(`✅ ${id ? "Updated" : "Added"} successfully!`);
    memberModal.hide();
    fetchCirculars();
  } catch (err) {
    console.error("❌ Network error:", err);
    alert("Network error — check console");
  } finally {
    btn.disabled = false;
    btn.innerText = "Save";
    fileInput.value = "";
  }
});


/* -------------------
   EDIT / DELETE
-------------------- */
document.addEventListener("click", async (e) => {
  if (e.target.classList.contains("btn-edit")) {
    const id = e.target.dataset.id;
    const title = e.target.dataset.title;
    const imgSrc = e.target.dataset.img;

    document.getElementById("circularId").value = id;
    document.getElementById("title").value = title;
    document.getElementById("circularimage").value = "";

    preview.src = imgSrc && imgSrc !== "null" ? imgSrc : "https://via.placeholder.com/100";

    document.getElementById("editNote").innerText =
      "🖼 Existing image will be kept unless you upload a new one.";
    document.querySelector("#memberModal .modal-title").innerText = "Edit Circular";
    memberModal.show();
  }

  if (e.target.classList.contains("btn-delete")) {
    const id = e.target.dataset.id;
    if (!confirm("Are you sure you want to delete this item?")) return;

    try {
      const res = await authorizedFetch(`${API_BASE}/delete-clean/${id}`, { method: "DELETE" });
      if (res.ok) {
        alert("🗑️ Deleted successfully!");
        fetchCirculars();
      } else {
        const json = await res.json();
        alert("❌ Delete failed: " + (json.message || res.status));
      }
    } catch (err) {
      console.error(err);
      alert("Network error while deleting.");
    }
  }
});

/* -------------------
   INIT
-------------------- */
function initFetchWhenReady() {
  // If roles already available, fetch immediately and apply any hide rules
  if (window.adminRoles && Array.isArray(window.adminRoles.roles) && window.adminRoles.roles.length) {
    try { window.adminRoles.hideIfNeeded && window.adminRoles.hideIfNeeded(); } catch (e) {}
    fetchCirculars();
    return;
  }

  // Listen for roles load (admin-roles.js will dispatch this)
  document.addEventListener('adminRolesLoaded', () => {
    try { window.adminRoles.hideIfNeeded && window.adminRoles.hideIfNeeded(); } catch (e) {}
    fetchCirculars();
  });

  // As a fallback, ensure we still fetch once DOM is ready after a short timeout
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (!(window.adminRoles && Array.isArray(window.adminRoles.roles) && window.adminRoles.roles.length)) {
        fetchCirculars();
      }
    }, 300);
  });
}

initFetchWhenReady();



</script>

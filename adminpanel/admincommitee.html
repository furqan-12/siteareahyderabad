<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Panel - Committees</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-2">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="../assests/logo.png" height="60px" width="60px" alt="Logo" class="me-2" />
            <span class="fw-bold text-success" style="font-size: 1rem;">Hyderabad SITE ASSOCIATION OF TRADE AND INDUSTRY</span>
            <span id="roleBadge" style="margin-left:12px; padding:6px 10px; background:#f0f0f0; border-radius:6px; color:#102b5d; font-weight:600; display:none;">Role: -</span>
        </a>
    </nav>

    <div class="container mt-4">
        <h2>Committees (placeholder)</h2>
        <p>This page is currently a stub. Add committee management UI here.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin-roles.js" defer></script>
    <script>
    // Show role badge when roles are available
    function showRoleBadge(roles) {
        try {
            const badge = document.getElementById('roleBadge');
            if (!badge) return;
            badge.style.display = 'inline-block';
            badge.textContent = 'Role: ' + (Array.isArray(roles) ? roles.join(', ') : String(roles));
        } catch (e) { console.warn('showRoleBadge error', e); }
    }

    document.addEventListener('adminRolesLoaded', (e) => {
        showRoleBadge(e.detail.roles || []);
    });

    if (window.adminRoles && Array.isArray(window.adminRoles.roles) && window.adminRoles.roles.length) {
        showRoleBadge(window.adminRoles.roles);
    }
    </script>
</body>
</html>
